name: Publish appliance images

# Builds + publishes the two appliance images (backend + frontend) to GHCR on
# every git tag matching v*. Manual dispatch is also supported for testing.
#
# Output:
#   ghcr.io/<owner>/connect-backend:vX.Y.Z   (+ :latest on the default branch)
#   ghcr.io/<owner>/connect-frontend:vX.Y.Z  (+ :latest on the default branch)
#
# Both images are multi-arch (linux/amd64 + linux/arm64) so the same compose
# file works on x86 mini PCs AND Raspberry Pi 5.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0 or test-build)'
        required: false
        default: 'manual-test'

permissions:
  contents: read
  packages: write   # required to push to GHCR

# Opt into Node 24 for v4 actions
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: appliance/Dockerfile.backend
            context: .
          - name: frontend
            dockerfile: appliance/Dockerfile.frontend
            context: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/connect-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/5812' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # The frontend image bakes REACT_APP_BACKEND_URL='' so axios issues
          # relative paths. Caddy in the same compose project proxies /api/* to
          # the backend service. Partners hosting the SPA on a separate origin
          # can override at build time:
          #   --build-arg REACT_APP_BACKEND_URL=https://api.example.org
          build-args: |
            REACT_APP_BACKEND_URL=
