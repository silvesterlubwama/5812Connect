# 58:12 Connect — appliance compose stack.
#
# Boots a self-contained 58:12 Connect deployment on any Docker host (mini PC,
# Raspberry Pi 5, VPS). LAN users browse to http://<host>/, remote users get a
# Cloudflare Tunnel URL when CLOUDFLARED_TOKEN is set.
#
# Bring up:    docker compose up -d
# Tear down:   docker compose down            (keeps data)
# Wipe data:   docker compose down -v         (DESTROYS the database)
#
# Persistent data (survives `docker compose down`):
#   ./data/mongo     → MongoDB datafiles
#   ./data/uploads   → User-uploaded files (photos, documents, badges)
#   ./data/backups   → Daily auto-backups from the iter-150 backup feature
#   ./data/caddy     → Let's Encrypt certs + Caddy state

name: connect

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db
    # Bind to internal network only — never expose 27017 to the host
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/silvesterlubwama/connect-backend:latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-connect}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      NFC_SECRET_KEY: ${NFC_SECRET_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      APP_VERSION: ${APP_VERSION:-appliance}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/backups:/app/backups
    expose:
      - "8001"
    # No host-port mapping — Caddy reverse-proxies; backend stays internal.

  caddy:
    image: ${FRONTEND_IMAGE:-ghcr.io/silvesterlubwama/connect-frontend:latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
      BACKEND_UPSTREAM: backend:8001
    volumes:
      - ./data/caddy:/data
      - ./data/caddy-config:/config

  # Optional — only spawned when CLOUDFLARED_TOKEN is set in .env.
  # Replaces "open a firewall port" with an outbound-only tunnel to
  # https://<your-subdomain>.5812-global.org or wherever.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    profiles:
      - tunnel
    # Profile-gated: bring up with `docker compose --profile tunnel up -d`
    # OR set COMPOSE_PROFILES=tunnel in your .env so plain `docker compose up`
    # also starts it.

  # ────────────────────────────────────────────────────────────
  # coturn — TURN relay for WebRTC media when staff are outside the office LAN.
  #
  # Our in-app softphone (JsSIP) registers straight into your Grandstream UCM
  # over WSS. When a user is on a hostile NAT (mobile hotspot, hotel wifi,
  # locked-down office network) STUN alone can't punch through — the browser
  # needs a relay. This runs coturn (~5 MB image) on the appliance and hands
  # its URL + creds to the browser via VoIP settings.
  #
  # Bring up with `docker compose --profile turn up -d`.
  #
  # Required firewall ports (open on the host):
  #   • UDP 3478   — TURN listener
  #   • TCP 3478   — TURN over TCP fallback
  #   • UDP 49152-65535 — relayed media (or the range configured in TURN_MIN/MAX)
  #
  # After starting, configure the TURN URL + shared secret in Admin → VoIP:
  #   turn:pbx.example.org:3478    (username/password from the env below)
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    profiles:
      - turn
    network_mode: host          # Required for UDP relay; bridge NAT breaks it
    command: >
      -n --log-file=stdout
      --external-ip=${TURN_EXTERNAL_IP:-$$(detect-external-ip)}
      --listening-port=3478
      --min-port=${TURN_MIN_PORT:-49152}
      --max-port=${TURN_MAX_PORT:-65535}
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-connect}:${TURN_PASSWORD:-changeme}
      --realm=${TURN_REALM:-connect.local}
      --no-tls --no-dtls

networks:
  default:
    name: connect-net
